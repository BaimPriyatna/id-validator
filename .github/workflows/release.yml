name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Typecheck each package
        run: |
          for p in packages/core packages/global/phone packages/global/email packages/global/iban packages/global/currency packages/id packages/data-id-address; do
            (cd "$p" && npx tsc --noEmit -p tsconfig.json)
          done
      # Report what the tag maps to before publishing. A tag pushed from a
      # commit whose versions were not bumped publishes nothing (see below);
      # this keeps that visible in the log instead of a bare "0 published".
      - name: Show version vs registry
        run: node scripts/publish-changed.mjs --dry-run
      # Publish only the packages whose version is ahead of what is already on
      # the registry, in dependency order. Publishing every package
      # unconditionally breaks as soon as one version is not bumped: npm
      # publish fails with EPUBLISHCONFLICT, the step exits non-zero, and
      # every package listed after it is silently never published. A tag whose
      # versions are all already live is a no-op rather than a red build.
      #
      # --provenance uses the id-token permission above to attach a signed
      # attestation linking each tarball back to this exact workflow run.
      - name: Publish changed packages
        run: node scripts/publish-changed.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
