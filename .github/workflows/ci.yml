name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Typecheck each package
        run: |
          for p in packages/core packages/global/phone packages/global/email packages/global/iban packages/global/currency packages/id packages/data-id-address; do
            (cd "$p" && npx tsc --noEmit -p tsconfig.json)
          done
      - run: npm test

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # size-limit@14 imports `glob` from node:fs/promises and declares
          # engines.node ^22.19.0 || ^24.5.0 || >=26, so it cannot run on the
          # Node 18/20 used elsewhere in this workflow. This job is the only
          # place size-limit runs, so bumping it here is sufficient -- the
          # published packages still support Node >= 18.
          #
          # Deliberately NOT using engine-strict: it would fail `npm ci` on the
          # Node 18/20 matrix entries, which install size-limit without ever
          # running it. The check below catches an unsupported runtime at the
          # point of use instead, without breaking the other matrix entries.
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check bundle size
        run: npm run size
